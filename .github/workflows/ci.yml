name: CI

# Every push and pull request: lint, tests, build and a look for known-vulnerable dependencies.
# Browser tests: the "browsers" job runs the website in Chromium, Firefox and WebKit (Playwright).
# The Edge suites in microservices/tests/e2e (real backend, accounts, speed) need Windows and
# Tesseract, so they are run on a developer machine with run.ps1 and are not part of this workflow.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: microservices/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: microservices/backend/requirements*.txt
      - name: Tesseract with English and Hindi
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-hin
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: Known vulnerabilities in the dependencies
        run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: microservices/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: microservices/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run check:contrast
      - name: Known vulnerabilities in the dependencies
        run: npm audit --omit=dev

  browsers:
    runs-on: ubuntu-24.04
    needs: frontend
    defaults:
      run:
        working-directory: microservices/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: microservices/frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      - run: npm run test:browsers
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: microservices/frontend/node_modules/.cache/playwright
          retention-days: 7

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -t kavach-backend microservices/backend
      - name: Start it and wait until it reports that Tesseract is ready
        run: |
          docker run -d --name kavach -p 8000:8000 kavach-backend
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health | grep -q '"ocr":"ready"'; then
              exit 0
            fi
            sleep 2
          done
          docker logs kavach
          exit 1
      - name: It runs as a normal user, judges a message, and can make a backup
        run: |
          test "$(docker exec kavach id -u)" = "10001"
          text='Stay on the video call. A warrant is issued. Transfer Rs 50,000 to the safe account.'
          id=$(curl -fsS -X POST http://127.0.0.1:8000/v1/scans -F kind=notice -F "text=$text" |
            grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
          for attempt in $(seq 1 20); do
            curl -fsS "http://127.0.0.1:8000/v1/scans/$id" > result.json
            grep -q '"status":"done"' result.json && break
            sleep 1
          done
          cat result.json
          grep -q '"riskLevel":"very_high"' result.json
          docker exec kavach python -m app.tools.backup --to /tmp/backups
          docker exec kavach sh -c 'ls /tmp/backups/*/kavach.db'
      - name: Logs hold no message text
        run: "! docker logs kavach 2>&1 | grep -qi 'video call'"
